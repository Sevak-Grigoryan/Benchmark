# Python environment for VLN-X500 Bench (the versions every published episode was built with).
#   conda env create -f environment.yml && conda activate vln_x500_bench
# Isaac Sim 5.1 comes from NVIDIA's pip index and needs a recent NVIDIA driver (see the Isaac Sim 5.1 requirements).
name: vln_x500_bench
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - ffmpeg
  - pip:
      - --extra-index-url https://pypi.nvidia.com
      - isaacsim[all,extscache]==5.1.0
      - pymavlink==2.4.49
      - numpy==1.26.0
      - scipy==1.15.3
      - pillow==11.3.0
